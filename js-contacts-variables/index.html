<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact List</title>
</head>
<body>

    <h1>Simple Contact List</h1> <!--h1 page title-->

    <table border="1"> <!--table to display contacts-->
        <thead>
            <tr>
                <th>Name</th> <!--table headers-->
                <th>Phone</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="firstName"></td> <!--table data cells with unique IDs-->
                <td id="firstPhone"></td> 
                <td id="firstEmail"></td>
            </tr>
            <tr>
                <td id="lastName"></td>
                <td id="lastPhone"></td>
                <td id="lastEmail"></td>
            </tr>
        </tbody>
    </table>

    <script src="script.js"></script> <!--link to external JavaScript file-->
    

</body>
</html>
