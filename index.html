<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Grocery Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Simple Grocery Store</h1>

  <div class="container">
    <div class="items">
      <h2>Grocery Items</h2>

      <div class="item">
        <span class="name">Milk</span>
        <span class="price">$3.49</span>
        <input id="qty-milk" type="number" min="0" placeholder="0" />
      </div>

      <div class="item">
        <span class="name">Bread</span>
        <span class="price">$2.99</span>
        <input id="qty-bread" type="number" min="0" placeholder="0" />
      </div>

      <div class="item">
        <span class="name">Eggs</span>
        <span class="price">$4.25</span>
        <input id="qty-eggs" type="number" min="0" placeholder="0" />
      </div>

      <div class="item">
        <span class="name">Rice</span>
        <span class="price">$6.50</span>
        <input id="qty-rice" type="number" min="0" placeholder="0" />
      </div>

      <div class="item">
        <span class="name">Apples</span>
        <span class="price">$1.20</span>
        <input id="qty-apples" type="number" min="0" placeholder="0" />
      </div>

      <div class="item">
        <span class="name">Chicken</span>
        <span class="price">$9.99</span>
        <input id="qty-chicken" type="number" min="0" placeholder="0" />
      </div>

      <div class="buttons">
        <button id="btn-calc">Calculate Total</button>
        <button id="btn-receipt">Print Receipt</button>
        <button id="btn-reset">Reset Cart</button>
      </div>

      <div class="total">
        Total: <strong id="total">$0.00</strong>
      </div>
    </div>

    <div class="receipt-area">
      <h2>Receipt</h2>
      <pre id="receipt"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
